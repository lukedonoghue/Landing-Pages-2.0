name: Verify native community routing
on:
  pull_request:
  push:
    branches: [main, community-skill]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-routing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test routing, reservations, fallback profiles and safe installation
        run: python3 skills/community-landing-page-builder/tests/test_native_routing.py
      - name: Verify committed OpenAI and Claude profiles match policy
        run: python3 scripts/install_community.py --project . --runtime both --check
