name: Recover interrupted QA patch
on:
  push:
    branches: [fix/qa-completion-integrity-20260924]
    paths: [.github/workflows/recover-qa-patch.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore verified patch and checkpoint only the repair branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; head=os.environ['GITHUB_SHA']
          def api(route, data=None, method=None):
              body=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+route,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          shas=['da7de4fb25e1bb404da829b784535795f21b037a','cb4c575b9e7645d01758c26f6e772f08c5f3eda6','26e63443caaf6fcda806847aeb96d065f5700942','7620501a4d66bce145c527d12da440a729430d2d','0be9165daa36444cf7c6a7402201cb2a30fe2bd6','c53cba5dab80ed729d37ec70b26b415c0a20961a','a2518b936ba646c720fb80a88cf457d12680d49e']
          chunks=[]
          for sha in shas:
              raw=base64.b64decode(api('git/blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              chunks.append(raw)
          patch=gzip.decompress(b''.join(chunks))
          out=pathlib.Path('recovered-qa');out.mkdir()
          file=out/'qa-integrity.patch';file.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(file)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(file)],check=True)
          subprocess.run(['python3','scripts/sync_crm_example.py'],check=True)
          subprocess.run(['git','add','skills/community-landing-page-builder','examples/crm-demo'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          entries=[]
          for name in filter(None,names):
              assert name.startswith(('skills/community-landing-page-builder/','examples/crm-demo/'))
              mode=subprocess.check_output(['git','ls-files','--stage','--',name]).decode().split()[0]
              entries.append({'path':name,'mode':mode,'type':'blob','content':pathlib.Path(name).read_text()})
          base=api('git/commits/'+head)['tree']['sha']
          tree=api('git/trees',{'base_tree':base,'tree':entries})
          commit=api('git/commits',{'message':'fix: enforce QA completion integrity, provenance and accessible form behavior','tree':tree['sha'],'parents':[head]})
          ref='heads/fix/qa-completion-integrity-20260924'
          assert api('git/ref/'+ref)['object']['sha']==head, 'Repair branch changed concurrently'
          api('git/refs/'+ref,{'sha':commit['sha'],'force':False},'PATCH')
          result={'commit':commit['sha'],'tree':tree['sha'],'files':names,'patch_sha256':hashlib.sha256(patch).hexdigest(),'main_changed':False}
          (out/'checkpoint.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-qa-checkpoint
          path: recovered-qa/
          retention-days: 3
