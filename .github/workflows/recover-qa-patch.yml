name: Recover interrupted QA patch
on:
  push:
    branches: [fix/qa-completion-integrity-20260924]
    paths: [.github/workflows/recover-qa-patch.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Repair known synthetic-journey warning evidence on repair branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['GITHUB_SHA']
          assert os.environ['GITHUB_REF']=='refs/heads/fix/qa-completion-integrity-20260924'
          root=pathlib.Path('skills/community-landing-page-builder/assets/cloudflare')
          p=root/'scripts/live-verify.mjs';s=p.read_text()
          a="if(attempt.runs>1)report.warnings.push('This run continues the same synthetic journey. Completed browser proof is retained; any acknowledgement retry uses the original private request and idempotency key, without another measured visit.');"
          b=a.replace('report.warnings.push','(report.notes ||= []).push')
          c="report.warnings.push('The authenticated receipt, CRM changes and metrics were verified before cleanup. Their hashed evidence is retained; cleanup recovery does not re-create a removed contact.');"
          d=c.replace('report.warnings.push','(report.notes ||= []).push')
          e="report.warnings.push('The controlled test contributes to historical metrics. It is identified in this report and the CRM verification note.');"
          f="""const warning = measurementExpected
                ? 'The controlled test contributes to historical metrics. It is identified in this report and the CRM verification note.'
                : 'The unmeasured synthetic lead remains in CRM history; analytics and conversion totals are unchanged.';
              report.warnings.push(warning);
              // The explicit test-lead choice authorizes this known impact, not arbitrary
              // warnings. Attach the actual measured before/after result to its disposition.
              if (report.fully_verified) {
                const proof = report.artifacts.find(item => item.type === 'dashboard_result');
                if (!proof) throw new Error('Synthetic impact has no retained dashboard evidence.');
                report.warning_dispositions = [{ warning, disposition: 'accepted_limit',
                  reason: 'The caller explicitly allowed one labeled synthetic enquiry. The retained dashboard comparison records its measured impact; soft-removal does not erase historical activity.',
                  evidence: proof }];
              }"""
          for old,new in [(a,b),(c,d),(e,f)]:
              assert s.count(old)==1
              s=s.replace(old,new)
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='071f68f89b6c4bfda63f2e3c38e7105bc7a1a0eab8702aaccbb6bfd3b908cf99'
          t=root/'tests/journey-recovery.test.mjs';v=t.read_text()
          old='function validateEvidence(f) {'
          new="""function validateEvidence(f) {
            const report=read(path.join(f.out,'local-journey.json'));
            assert.ok(report.notes?.some(note=>note.includes('same synthetic journey')));
            assert.equal(report.warning_dispositions?.length,1);
            assert.equal(report.warning_dispositions[0].warning,report.warnings[0]);
            assert.equal(report.warning_dispositions[0].disposition,'accepted_limit');
            assert.equal(report.warning_dispositions[0].evidence.type,'dashboard_result');"""
          assert v.count(old)==1;t.write_text(v.replace(old,new))
          assert hashlib.sha256(t.read_bytes()).hexdigest()=='b1de59cf5871f00fdc5ac2cc8890d55f41756a30a6e5e93987ab272e28a56e08'
          for file in [p,t]:subprocess.run(['node','--check',str(file)],check=True)
          subprocess.run(['python3','scripts/sync_crm_example.py'],check=True)
          subprocess.run(['git','add','skills/community-landing-page-builder','examples/crm-demo'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          names=list(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          def api(route,data=None,method=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+route,data=json.dumps(data).encode() if data is not None else None,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          entries=[]
          for name in names:
              assert name.startswith(('skills/community-landing-page-builder/','examples/crm-demo/'))
              mode=subprocess.check_output(['git','ls-files','--stage','--',name]).decode().split()[0]
              entries.append({'path':name,'mode':mode,'type':'blob','content':pathlib.Path(name).read_text()})
          base=api('git/commits/'+head)['tree']['sha']
          tree=api('git/trees',{'base_tree':base,'tree':entries})
          commit=api('git/commits',{'message':'fix: attach actual dashboard evidence to authorized synthetic impact','tree':tree['sha'],'parents':[head]})
          ref='heads/fix/qa-completion-integrity-20260924'
          assert api('git/ref/'+ref)['object']['sha']==head
          api('git/refs/'+ref,{'sha':commit['sha'],'force':False},'PATCH')
          print(json.dumps({'commit':commit['sha'],'files':names,'main_changed':False}))
          PY
