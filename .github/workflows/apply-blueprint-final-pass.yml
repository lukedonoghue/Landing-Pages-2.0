name: Apply verified remediation final pass
on:
  push:
    branches: [fix/remediation-blueprint-final-pass]
    paths: [.github/workflows/apply-blueprint-final-pass.yml]
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and checkpoint reviewed text changes, then remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, tempfile, urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['GITHUB_SHA']
          branch='fix/remediation-blueprint-final-pass'
          assert os.environ['GITHUB_REF']=='refs/heads/'+branch
          def api(route,data=None,method=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+route,data=json.dumps(data).encode() if data is not None else None,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as response:return json.load(response)
          shas=['fd03730c8292ffb56f86acadebf3b2d9d980a46d','07046d28210708f13bda802a4e35da5add6dc5e1','a1f31c80bbf33ffd19438917f7fd2bf50ffcbc86','42351fbccd0a7b88ba5ee98f08b5cb9ae787745a','3e65ee0cede46086d4c645945c6890593f2381ff','b26b489aaf4a23ff76fd2b4e05b58173323be6f6','34ef91a2c6b45a6ba3a7a53d7fd1f980568fb9dc','0e3eca21efae353bf8d31fe4fccc59ad08b6e920','1b82a904b1c38c4a4cc190cdb4e79a6e932943f8','8fba0fac5cd8512ca7c2496952e652be5c23adfd','1c4f77b541c5f099041e80f3a21c9ccb4fe7ef72','d3dc2a08cd43a02d5be85b33eec5b8427cf30e0a']
          chunks=[]
          for sha in shas:
              raw=base64.b64decode(api('git/blobs/'+sha)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              chunks.append(raw)
          patch=lzma.decompress(b''.join(chunks))
          assert hashlib.sha256(patch).hexdigest()=='3bc5c812d1907bc9498b25a10bba038db5ead92a508b1718f23f96b1f6b335ac'
          with tempfile.TemporaryDirectory() as tmp:
              p=pathlib.Path(tmp)/'verified.patch';p.write_bytes(patch)
              subprocess.run(['git','apply','--check','--unidiff-zero',str(p)],check=True)
              subprocess.run(['git','apply','--unidiff-zero',str(p)],check=True)
          subprocess.run(['python3','scripts/sync_crm_example.py'],check=True)
          subprocess.run(['python3','-m','compileall','-q','skills/community-landing-page-builder/scripts','skills/community-landing-page-builder/tests'],check=True)
          subprocess.run(['git','add','skills/community-landing-page-builder','examples/crm-demo'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          names=list(filter(None,subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')))
          entries=[]
          for name in names:
              assert name.startswith(('skills/community-landing-page-builder/','examples/crm-demo/'))
              assert not name.endswith(('.ttf','.otf','.woff','.woff2','.pyc'))
              assert '.secrets' not in pathlib.Path(name).parts
              mode=subprocess.check_output(['git','ls-files','--stage','--',name]).decode().split()[0]
              text=pathlib.Path(name).read_text()
              if name.endswith(('.mjs','.js')):subprocess.run(['node','--check',name],check=True)
              entries.append({'path':name,'mode':mode,'type':'blob','content':text})
          assert entries
          entries.append({'path':'.github/workflows/apply-blueprint-final-pass.yml','mode':'100644','type':'blob','sha':None})
          base=api('git/commits/'+head)['tree']['sha']
          tree=api('git/trees',{'base_tree':base,'tree':entries})
          commit=api('git/commits',{'message':'fix: close remediation blueprint gaps across release, research, review and export','tree':tree['sha'],'parents':[head]})
          ref='heads/'+branch
          assert api('git/ref/'+ref)['object']['sha']==head, 'Review branch changed concurrently'
          api('git/refs/'+ref,{'sha':commit['sha'],'force':False},'PATCH')
          print(json.dumps({'commit':commit['sha'],'tree':tree['sha'],'changed_files':names,'temporary_workflow_removed':True,'main_changed':False}))
          PY
