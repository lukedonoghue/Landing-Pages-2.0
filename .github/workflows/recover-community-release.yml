name: Recover interrupted community release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-community-release.yml']

permissions:
  contents: read

jobs:
  verify-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply only the reviewed queue fixture correction
        run: |
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('skills/community-landing-page-builder/assets/cloudflare/tests/backend.test.mjs')
          raw = p.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '0d3629c46cad54000602122217f504cb9e60df72460e8544d36869009a245e9c', 'Reviewed file changed; reconcile rather than overwrite'
          text = raw.decode()
          start = text.index("test('old orphan jobs cannot starve a scheduled batch of one',async()=>{")
          assert text[start:].strip().endswith('});')
          text = text[:start] + '''test('old orphan jobs cannot starve a scheduled batch of one',async()=>{
            // Preserve the real UNIQUE(webhook_id,lead_id) contract: each orphan
            // belongs to a different removed lead. Exceed the cleanup batch so
            // the five remaining old jobs also have to be filtered before LIMIT.
            await db.prepare("UPDATE webhook_outbox SET status='failed' WHERE status IN ('pending','sending')").run();
            const stamp=new Date().toISOString(),hook=crypto.randomUUID(),lead=crypto.randomUUID();
            const deleted=Array.from({length:105},()=>crypto.randomUUID());
            const seedLead=(id,removed)=>db.prepare('INSERT INTO leads(id,receipt_id,idempotency_key,payload_hash,created_at,updated_at,reporting_day,form_name,form_data,attribution,landing_page,deleted_at) VALUES(?,?,?,?,?,?,?,?,?,?,?,?)').bind(id,crypto.randomUUID(),crypto.randomUUID(),'hash',stamp,stamp,stamp.slice(0,10),'test','{}','{}','/',removed?stamp:null);
            await db.batch([seedLead(lead,false),...deleted.map(id=>seedLead(id,true))]);
            await db.prepare('INSERT INTO webhooks(id,name,url,enabled,created_at) VALUES(?,?,?,1,?)').bind(hook,'synthetic','https://hooks.example.com/',stamp).run();
            await db.batch(deleted.map(id=>db.prepare('INSERT INTO webhook_outbox(id,webhook_id,lead_id,next_attempt_at,created_at) VALUES(?,?,?,0,?)').bind(crypto.randomUUID(),hook,id,stamp)));
            const valid=crypto.randomUUID();await db.prepare('INSERT INTO webhook_outbox(id,webhook_id,lead_id,next_attempt_at,created_at) VALUES(?,?,?,1,?)').bind(valid,hook,lead,stamp).run();
            const original=globalThis.fetch;globalThis.fetch=async()=>{throw new Error('Synthetic offline seam');};
            try {await processOutbox({DB:db},1);}finally{globalThis.fetch=original;}
            assert.equal(await db.prepare('SELECT attempts FROM webhook_outbox WHERE id=?').bind(valid).first('attempts'),1);
            assert.equal(await db.prepare("SELECT COUNT(*) AS n FROM webhook_outbox WHERE webhook_id=? AND status='failed'").bind(hook).first('n'),100);
            assert.equal(await db.prepare("SELECT COUNT(*) AS n FROM webhook_outbox WHERE webhook_id=? AND lead_id<>? AND status='pending'").bind(hook,lead).first('n'),5);
          });
          '''
          p.write_text(text)
          PY
      - name: Install locked application tools
        working-directory: skills/community-landing-page-builder/assets/cloudflare
        run: npm ci
      - name: Verify corrected fixture against real local D1
        working-directory: skills/community-landing-page-builder/assets/cloudflare
        run: node --test --test-reporter=tap tests/backend.test.mjs
      - name: Collect dependency and native CLI diagnostics without signing in
        run: |
          mkdir -p recovery-diagnostics
          cd skills/community-landing-page-builder/assets/cloudflare
          npm audit --json > "$GITHUB_WORKSPACE/recovery-diagnostics/npm-audit.json" || test -s "$GITHUB_WORKSPACE/recovery-diagnostics/npm-audit.json"
          cd "$GITHUB_WORKSPACE"
          npm exec --yes --package @openai/codex -- codex --version > recovery-diagnostics/codex-version.txt
          npm exec --yes --package @openai/codex -- codex exec --help > recovery-diagnostics/codex-exec-help.txt
          npm exec --yes --package @anthropic-ai/claude-code -- claude --version > recovery-diagnostics/claude-version.txt
          npm exec --yes --package @anthropic-ai/claude-code -- claude --help > recovery-diagnostics/claude-help.txt
          python3 - <<'PY'
          import json
          value=json.load(open('recovery-diagnostics/npm-audit.json'))
          print(json.dumps(value.get('vulnerabilities', value), indent=2))
          PY
      - name: Prepare a tree for explicit coordinator fast-forward, with this one-time workflow removed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path, data=None):
              request=urllib.request.Request(base+path, data=json.dumps(data).encode() if data is not None else None, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
          head=os.environ['GITHUB_SHA']
          assert api('/git/ref/heads/main')['object']['sha']==head, 'Main changed; do not prepare against a stale head'
          path='skills/community-landing-page-builder/assets/cloudflare/tests/backend.test.mjs'
          blob=api('/git/blobs',{'content':pathlib.Path(path).read_text(),'encoding':'utf-8'})
          tree=api('/git/trees',{'base_tree':api('/git/commits/'+head)['tree']['sha'],'tree':[{'path':path,'mode':'100644','type':'blob','sha':blob['sha']},{'path':'.github/workflows/recover-community-release.yml','mode':'100644','type':'blob','sha':None}]})
          record={'parent':head,'tree':tree['sha'],'changed_file':path,'blob':blob['sha'],'note':'No ref was changed. Coordinator must create and fast-forward the reviewed commit.'}
          pathlib.Path('recovery-diagnostics/prepared-tree.json').write_text(json.dumps(record,indent=2)+'\n')
          print('REVIEWED_RECOVERY_TREE '+json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-diagnostics
          path: recovery-diagnostics/
          if-no-files-found: error
          retention-days: 7
