name: Prepare reviewed integration

on:
  push:
    branches: [feature/review-intelligence-testimonials]
    paths: [.github/workflows/integrate-review-polish.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply byte-verified patch and export blobs for explicit integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path,data=None):
              req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          main='05888e16fb8cf17bc7cac1c9242b1d48486add4c'
          original='2a8685b5bf832a54df57c3c607a864c17c0c8948'
          head=os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()==original,'Branch changed; reconcile instead of overwriting'
          assert api('/git/ref/heads/main')['object']['sha']==main,'Main changed; reconcile first'
          assert api('/git/ref/heads/feature/review-intelligence-testimonials')['object']['sha']==head,'Feature branch changed'
          stored=api('/git/blobs/c0226016d5174e307df714d594e3d6d4c915afa3')
          patch=lzma.decompress(base64.b64decode(stored['content']))
          assert hashlib.sha256(patch).hexdigest()=='0daff4f685eda40790c0627ba7cdcc96ea5bc386595697728de91189da4b473f','Patch integrity mismatch'
          patchfile=pathlib.Path('/tmp/review-final.patch');patchfile.write_bytes(patch)
          subprocess.run(['git','apply','--unidiff-zero','--check',str(patchfile)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(patchfile)],check=True)
          skill='skills/community-landing-page-builder/'
          expected={
            skill+'SKILL.md':'6d1630879c7b9a047a75916d27a76653261a844d',
            skill+'assets/guide/app.js':'28eb293883deb60885b9bf16b464677125c1c4b7',
            skill+'references/guided-workflow.md':'35141e15bd53244b29fbcd1efe692af679c65f00',
            skill+'references/reader-guide-quality.md':'02994a1842cd8745b687b17c6cf61806c6a8d875',
            skill+'references/guide-image-handoff.md':'9eb1fc24ae6796b880638f2de0c9d92db1cb6364',
            skill+'scripts/demo_project.py':'fa24f4b39e6969c6ce29c3e9e1e7d188a807f15b',
            skill+'scripts/guide.py':'d3cd7049f586901633c2c74b3c57cd2de40ddc48',
            skill+'scripts/quickstart.py':'9d91ec2004816f870072c45932fe0a6fe80167b3',
            skill+'scripts/review_workflow.py':'ee1b23662686cbcfcfa458727f5adb6a5c4c4cdd',
            skill+'scripts/scaffold_project.py':'9035a0660602cd348459c1a988d63721b7848dde',
            skill+'scripts/validate_reviews.py':'52140642c51bcebe0b002eebe11e802ae4b2b7c3',
            skill+'scripts/workflow_progress.py':'4d1c68b3052868f3644724cc3a1c184ff6a42787',
            skill+'scripts/workflow_runner.py':'c7a88ce9b93af7eae475c18b992558fd7a2fa2d3',
            skill+'scripts/guide_image_handoff.py':'abb8e1b0f862e9f7f1575a294b51fe8c89787025',
            skill+'tests/test_review_workflow.py':'73bb94dc7e4631617fb873fd0074cfe38e942723',
            skill+'tests/test_guide_image_handoff.py':'24022c09da67601e7426ca138556fd52575293e8',
            'tests/test_dev_entrypoint.py':'47e94df904848c57db164f2750e5726c66c909bb'
          }
          for name,digest in expected.items():
              raw=pathlib.Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==digest,'Output differs from local verified patch: '+name
          subprocess.run(['python','-m','compileall','-q',skill+'scripts',skill+'tests'],check=True)
          subprocess.run(['python','scripts/install_community.py','--project','.','--runtime','both','--check'],check=True)
          record={'parent':head,'main':main,'base_tree':api('/git/commits/'+head)['tree']['sha'],'entries':[],
                  'scope':'Transport and syntax/profile checks only. Full PR tests still required. No ref, provider, deployment or lead changed.'}
          directory=pathlib.Path('integration-transport');directory.mkdir()
          out=directory/'prepared-entries.json'
          for name,digest in expected.items():
              blob=api('/git/blobs',{'content':pathlib.Path(name).read_text(),'encoding':'utf-8'})
              assert blob['sha']==digest
              record['entries'].append({'path':name,'mode':'100644','type':'blob','sha':digest})
              out.write_text(json.dumps(record,indent=2)+'\n')
          record['entries'].append({'path':'.github/workflows/integrate-review-polish.yml','mode':'100644','type':'blob','sha':None})
          out.write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-integration-entries
          path: integration-transport/
          if-no-files-found: error
          retention-days: 3
