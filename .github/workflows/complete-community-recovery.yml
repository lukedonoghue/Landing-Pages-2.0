name: Complete community recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-community-recovery.yml']

permissions:
  contents: read

jobs:
  verify-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the exact reviewed patch without overwriting concurrent edits
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib,subprocess
          encoded='?'
          PY
