name: Complete community recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-community-recovery.yml', '.github/recovery/**']

permissions:
  contents: read

jobs:
  verify-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y webp poppler-utils
          python -m pip install -r skills/community-landing-page-builder/requirements-build.txt PyYAML
      - name: Reuse exact previously verified patch with preimage checks
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,yaml
          pinned='dbc293ba0d125f4809ae05478b7fe06cf46e7ce8:.github/workflows/complete-community-recovery.yml'
          previous=yaml.safe_load(subprocess.check_output(['git','show',pinned],text=True))
          steps=previous['jobs']['verify-patch']['steps']
          patch=next(s['run'] for s in steps if s.get('name')=='Apply reviewed source changes with exact preimage checks')
          subprocess.run(['bash','-e','-c',patch],check=True)
          app=pathlib.Path('skills/community-landing-page-builder/assets/guide/app.js')
          text=app.read_text()
          replacements=[('async function act(fn){','async function act(fn,force=true){'),('await fn();await refresh(true);','await fn();await refresh(force);'),('const button=(label,handler)=>','const button=(label,handler,force=true)=>'),('()=>act(handler)','()=>act(handler,force)'),('help.textContent=h.explanation;}));','help.textContent=h.explanation;},false));')]
          for old,new in replacements:
              assert old in text,old
              text=text.replace(old,new)
          app.write_text(text)
          workflow=pathlib.Path('.github/workflows/community-release.yml')
          text=workflow.read_text()
          old='          path: skills/community-landing-page-builder/assets/cloudflare/community-node-results.tap'
          assert old in text
          workflow.write_text(text.replace(old,'          path: |\n            skills/community-landing-page-builder/assets/cloudflare/community-node-results.tap\n            skills/community-landing-page-builder/assets/cloudflare/build/guide-ui-review/'))
          manifest=pathlib.Path('recovery-diagnostics/changed-files.json')
          names=json.loads(manifest.read_text());names.append(str(app));manifest.write_text(json.dumps(names))
          PY
      - name: Verify complete Python contracts
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s skills/community-landing-page-builder/tests -p 'test_*.py' -v 2>&1 | tee recovery-diagnostics/python-results.txt
      - name: Lock patched dependencies and install real browsers
        working-directory: skills/community-landing-page-builder/assets/cloudflare
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --json > "$GITHUB_WORKSPACE/recovery-diagnostics/npm-audit.json"
          npm audit --audit-level=high
          npx playwright-core install --with-deps chromium webkit
      - name: Verify real guide screens and application boundaries
        working-directory: skills/community-landing-page-builder/assets/cloudflare
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/backend.test.mjs tests/team-accounts.test.mjs tests/email-recipients.test.mjs tests/pages-gateway.test.mjs tests/workflow.test.mjs tests/guide-ui.test.mjs | tee "$GITHUB_WORKSPACE/recovery-diagnostics/node-results.tap"
          npm run deploy:dry
      - name: Export verified Git blobs for explicit connector integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,shutil,urllib.request
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          def api(path,data=None):
              req=urllib.request.Request(base+path,data=json.dumps(data).encode() if data is not None else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          head=os.environ['GITHUB_SHA'];assert api('/git/ref/heads/main')['object']['sha']==head,'Main changed; reconcile before integration'
          record={'parent':head,'base_tree':api('/git/commits/'+head)['tree']['sha'],'entries':[],'note':'No tree, commit or ref is changed. Coordinator integrates verified blobs and removes temporary transport.'}
          output=pathlib.Path('recovery-diagnostics/prepared-entries.json')
          for name in json.loads(pathlib.Path('recovery-diagnostics/changed-files.json').read_text()):
              file=pathlib.Path(name);dest=pathlib.Path('recovery-diagnostics/verified-files')/name;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(file,dest)
              blob=api('/git/blobs',{'content':file.read_text(),'encoding':'utf-8'})
              record['entries'].append({'path':name,'mode':'100644','type':'blob','sha':blob['sha']})
              output.write_text(json.dumps(record,indent=2)+'\n')
          for name in ['.github/workflows/complete-community-recovery.yml','.github/recovery/runtime_context.py','.github/recovery/test_portable_runtime.py']:
              record['entries'].append({'path':name,'mode':'100644','type':'blob','sha':None})
          output.write_text(json.dumps(record,indent=2)+'\n')
          print('VERIFIED_RECOVERY_ENTRIES '+json.dumps(record))
          PY
      - name: Preserve synthetic browser evidence
        if: always()
        run: |
          mkdir -p recovery-diagnostics
          if [ -d skills/community-landing-page-builder/assets/cloudflare/build/guide-ui-review ]; then cp -R skills/community-landing-page-builder/assets/cloudflare/build/guide-ui-review recovery-diagnostics/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-recovery-diagnostics
          path: recovery-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
