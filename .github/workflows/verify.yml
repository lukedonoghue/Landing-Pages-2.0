name: Verify skill and application

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Copy, approval, image, and evidence checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual image optimization dependency
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y webp
          cwebp -version
      - name: Check copy library, research, and user approvals
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check evidence integrity and stale-report rejection
        run: python3 skills/branded-lead-funnel-builder/scripts/test_gates.py
      - name: Check image acquisition, generation metadata, and real WebP optimization
        run: python3 skills/branded-lead-funnel-builder/tests/test_image_workflow.py

  application-checks:
    name: Worker, CRM, tracking, and browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skills/branded-lead-funnel-builder/assets/cloudflare
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Publishing workflow tests invoke the Python evidence checker locally.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: skills/branded-lead-funnel-builder/assets/cloudflare/package-lock.json
      - name: Install locked application dependencies
        run: npm ci
      - name: Install supported browsers and Linux runtime libraries
        run: npx playwright-core install --with-deps chromium webkit
      - name: Require both engines and expose Chromium to existing browser tests
        run: |
          node --input-type=module - <<'NODE'
          import { chromium, webkit } from 'playwright-core';
          import { appendFileSync, accessSync, constants } from 'node:fs';
          const executable = chromium.executablePath();
          accessSync(executable, constants.X_OK);
          appendFileSync(process.env.GITHUB_ENV, `CHROME_BIN=${executable}\n`);
          for (const [name, engine] of Object.entries({ chromium, webkit })) {
            const browser = await engine.launch({ headless: true });
            await browser.close();
            console.log(`${name} is installed and launches`);
          }
          NODE
      - name: Run local application and browser tests
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.mjs | tee node-test-results.tap
      - name: Reject a green run that skipped browser regressions
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = readFileSync('node-test-results.tap', 'utf8');
          const skipped = report.match(/^# skipped (\d+)$/m);
          if (!skipped || Number(skipped[1]) !== 0) throw new Error('Every application test must execute; missing browsers cannot silently skip checks.');
          NODE
      - name: Keep the regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-test-results
          path: skills/branded-lead-funnel-builder/assets/cloudflare/node-test-results.tap
          if-no-files-found: ignore
          retention-days: 14
