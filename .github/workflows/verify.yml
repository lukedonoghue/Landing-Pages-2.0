name: Verify current community skill and end-to-end local demo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository entrypoint and compatibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current community document and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y webp poppler-utils
          python -m pip install -r skills/community-landing-page-builder/requirements-build.txt PyYAML
      - name: Run repository integration contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify current community catalogue and reader-guide layout contracts
        run: |
          python3 skills/community-landing-page-builder/tests/test_catalogue.py
          python3 skills/community-landing-page-builder/tests/test_reader_layout.py

  application-checks:
    name: Current community app, browsers, and fresh local demo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skills/community-landing-page-builder/assets/cloudflare
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: skills/community-landing-page-builder/assets/cloudflare/package-lock.json
      - name: Install current community PDF, image, and application dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y webp poppler-utils
          python -m pip install -r ../../requirements-build.txt PyYAML
          npm ci
          npm audit --audit-level=high
      - name: Install supported browsers and Linux runtime libraries
        run: npx playwright-core install --with-deps chromium webkit
      - name: Require both engines and expose Chromium to local verification
        run: |
          node --input-type=module - <<'NODE'
          import { chromium, webkit } from 'playwright-core';
          import { appendFileSync, accessSync, constants } from 'node:fs';
          const executable = chromium.executablePath();
          accessSync(executable, constants.X_OK);
          appendFileSync(process.env.GITHUB_ENV, `CHROME_BIN=${executable}\n`);
          for (const [name, engine] of Object.entries({ chromium, webkit })) {
            const browser = await engine.launch({ headless: true });
            await browser.close();
            console.log(`${name} is installed and launches`);
          }
          NODE
      - name: Run current community application and browser regressions
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.mjs | tee community-node-test-results.tap
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = readFileSync('community-node-test-results.tap', 'utf8');
          const skipped = report.match(/^# skipped (\d+)$/m);
          if (!skipped || Number(skipped[1]) !== 0) throw new Error('Every current community application test must execute; missing browsers cannot silently skip checks.');
          NODE
      - name: Bundle the current Worker without publishing
        run: npm run deploy:dry
      - name: Generate a fresh fictional project through the public repository entrypoint
        working-directory: .
        run: python scripts/dev.py demo
      - name: Verify the generated page, researched PDF path, local D1 and CRM
        working-directory: .
        run: python scripts/dev.py verify-demo --full
      - name: Keep current application and synthetic demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-community-local-evidence
          include-hidden-files: true
          path: |
            skills/community-landing-page-builder/assets/cloudflare/community-node-test-results.tap
            skills/community-landing-page-builder/assets/cloudflare/build/guide-ui-review/
            skills/community-landing-page-builder/assets/cloudflare/build/reader-delivery-review/
            .development/demo/build/demo-verification.json
            .development/demo/build/browser-compat/
            .development/demo/build/live-verification/
            .development/demo/build/layout/
            .development/demo/build/performance/
            .development/demo/build/pdf/
            .development/demo/build/rendered-copy/
          if-no-files-found: ignore
          retention-days: 14
