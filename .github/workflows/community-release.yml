name: Verify community release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    name: Pin reviewable community source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked implementation and tests, without credentials or font binaries
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          files = subprocess.check_output(['git', 'ls-files', '-z', '--', 'skills/community-landing-page-builder', 'scripts', 'tests', '.github', '.codex', '.claude', 'AGENTS.md', 'CLAUDE.md', 'README.md', 'README-LEGACY.md']).decode().split('\0')
          excluded = {'.git', '.secrets', 'node_modules', '.wrangler', '__pycache__'}
          hashes = {}
          with tarfile.open('community-source.tar.gz', 'w:gz') as archive:
              for name in files:
                  if not name:
                      continue
                  path = root / name
                  if not path.is_file() or path.is_symlink() or excluded.intersection(path.relative_to(root).parts):
                      continue
                  if path.name.startswith(('.env', '.dev.vars')) or path.suffix.lower() in {'.pem', '.key', '.p12', '.pfx', '.woff', '.woff2', '.ttf', '.otf'}:
                      continue
                  hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest()
                  archive.add(path, arcname=name, recursive=False)
          pathlib.Path('community-source-manifest.json').write_text(json.dumps({'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(), 'files': hashes, 'note': 'Tracked review snapshot; font binaries intentionally omitted. CI tests run against the complete checkout.'}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: community-source-${{ github.sha }}
          path: |
            community-source.tar.gz
            community-source-manifest.json
          retention-days: 7

  python-checks:
    name: Community Python and workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and document test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y webp poppler-utils
          python -m pip install -r skills/community-landing-page-builder/requirements-build.txt PyYAML
      - name: Compile maintained Python
        run: python -m compileall -q skills/community-landing-page-builder/scripts
      - name: Run community tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s skills/community-landing-page-builder/tests -p 'test_*.py' -v 2>&1 | tee community-python-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-python-results
          path: community-python-results.txt
          if-no-files-found: ignore
          retention-days: 14

  application-checks:
    name: Community Worker, CRM, forms and browsers
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: skills/community-landing-page-builder/assets/cloudflare
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: skills/community-landing-page-builder/assets/cloudflare/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Install both supported browser engines
        run: npx playwright-core install --with-deps chromium webkit
      - name: Require real browser executables
        run: |
          node --input-type=module - <<'JS'
          import {chromium, webkit} from 'playwright-core';
          import {appendFileSync} from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `CHROME_BIN=${chromium.executablePath()}\n`);
          for (const engine of [chromium, webkit]) {
            const browser = await engine.launch({headless: true});
            await browser.close();
          }
          JS
      - name: Run application tests without silent skips
        shell: bash
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/*.test.mjs | tee community-node-results.tap
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const report = readFileSync('community-node-results.tap', 'utf8');
          if (!/^# skipped 0$/m.test(report)) throw new Error('Community browser tests must execute, not skip.');
          JS
      - name: Bundle the Worker without publishing
        run: npm run deploy:dry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-application-results
          path: skills/community-landing-page-builder/assets/cloudflare/community-node-results.tap
          if-no-files-found: ignore
          retention-days: 14
