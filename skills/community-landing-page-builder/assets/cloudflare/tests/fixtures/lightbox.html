<!-- Copy and adapt the fields only after the form schema is approved. -->
<button type="button" data-open-modal>Request the guide and estimate</button>

<div id="lead-modal" class="modal" role="dialog" aria-modal="true"
     aria-labelledby="lead-modal-title" aria-hidden="true">
  <div class="modal__panel">
    <button class="modal__close" data-close-modal type="button" aria-label="Close form">×</button>
    <h2 id="lead-modal-title">Request the guide and estimate</h2>
    <p role="status" aria-live="polite" aria-atomic="true">Step <strong data-step-current>1</strong> of 3</p>
    <div class="wizard__progress" aria-hidden="true"><span data-progress></span></div>

    <form class="wizard" data-lead-form action="thank-you.html"
          data-thank-you="thank-you.html"
          data-endpoint="/api/leads"
          data-storage-prefix="example_funnel_"
          novalidate>
      <label hidden aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>
      <fieldset class="wizard__step">
        <legend>How can we reach you?</legend>
        <label>First name <input name="first_name" autocomplete="given-name" required></label>
        <label>Last name <input name="last_name" autocomplete="family-name" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Phone <input name="phone" type="tel" autocomplete="tel" required></label>
      </fieldset>

      <fieldset class="wizard__step" hidden>
        <legend>What do you need?</legend>
        <label>Service
          <select name="service" required>
            <option value="">Select a service</option>
            <option>Service one</option>
            <option>Service two</option>
          </select>
        </label>
      </fieldset>

      <fieldset class="wizard__step" hidden>
        <legend>Confirm the next step</legend>
        <label><input type="radio" name="contact_method" value="Phone" required> Phone</label>
        <label><input type="radio" name="contact_method" value="Email" required> Email</label>
      </fieldset>

      <p data-form-error role="alert" tabindex="-1" hidden></p>
      <div class="wizard__actions">
        <button type="button" data-back hidden>Back</button>
        <button type="button" data-next>Continue</button>
        <button type="submit" data-submit hidden>Request the guide and estimate</button>
      </div>
    </form>
  </div>
</div>
