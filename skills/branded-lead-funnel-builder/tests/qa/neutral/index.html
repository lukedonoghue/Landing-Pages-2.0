<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neutral QA fixture</title>
<style>body{margin:0;color:#182621;background:#fff;font:18px/1.5 system-ui}main{padding:24px;max-width:960px;margin:auto}button,input{font:inherit}button{padding:12px 18px;cursor:pointer}h1{font-size:clamp(28px,5vw,48px);line-height:1.1}section{padding:24px 0}#lead-modal[aria-hidden="true"]{display:none}#lead-modal{position:fixed;inset:0;display:grid;place-items:center;background:#0009;z-index:2}#dialog{box-sizing:border-box;width:min(90vw,480px);max-height:90vh;overflow:auto;padding:24px;background:white}label{display:block}input{box-sizing:border-box;width:100%}.wizard__step[hidden],[hidden]{display:none!important}button:focus-visible,input:focus-visible{outline:3px solid #127854;outline-offset:3px}</style>
<main><h1>A clear route to a better project</h1><p>A neutral fixture for testing the browser harness.</p><button data-open-modal>Request details</button><section><h2>Plan the right next step</h2><p>This fixture contains no client-specific claims or assets.</p></section><button data-open-modal>Request details</button></main>
<div id="lead-modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-title"><div id="dialog"><button data-close-modal>Close</button><h2 id="modal-title">Request details</h2><form><section class="wizard__step"><label>Name<input name="name" required></label></section><section class="wizard__step" hidden><label>Email<input name="email" type="email" required></label></section><button type="button" data-back hidden>Back</button><button type="button" data-next>Continue</button><button type="submit" data-submit hidden>Request details</button></form></div></div>
<script>
const modal=document.querySelector('#lead-modal'),steps=[...document.querySelectorAll('.wizard__step')],next=document.querySelector('[data-next]'),back=document.querySelector('[data-back]'),submit=document.querySelector('[data-submit]');let current=0,opener;function show(n){current=n;steps.forEach((el,i)=>el.hidden=i!==n);back.hidden=n===0;next.hidden=n===steps.length-1;submit.hidden=n!==steps.length-1;}function close(){modal.setAttribute('aria-hidden','true');opener.focus()}document.querySelectorAll('[data-open-modal]').forEach(el=>el.addEventListener('click',()=>{opener=el;show(0);modal.setAttribute('aria-hidden','false');steps[0].querySelector('input').focus()}));document.querySelector('[data-close-modal]').onclick=close;next.onclick=()=>{const field=steps[current].querySelector('input');if(field.reportValidity()){show(current+1);steps[current].querySelector('input').focus()}};back.onclick=()=>{show(current-1);steps[current].querySelector("input").focus()};modal.addEventListener('keydown',e=>{if(e.key==='Escape'){close();return}if(e.key!=='Tab')return;const all=[...modal.querySelectorAll('button,input')].filter(el=>el.offsetParent!==null),first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});document.querySelector('form').onsubmit=e=>e.preventDefault();
</script></html>
