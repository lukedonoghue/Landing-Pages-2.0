default_permissions = "lp-build"

[agents]
max_concurrent_threads_per_session = 4

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
experimental_use_profile = false
[shell_environment_policy.filters]
"CLOUDFLARE_*" = "exclude"
"CF_API_*" = "exclude"
"GOOGLE_APPLICATION_CREDENTIALS" = "exclude"
"*PASSWORD*" = "exclude"
"*SECRET*" = "exclude"
"*TOKEN*" = "exclude"
"AWS_*" = "exclude"
"AZURE_*" = "exclude"
"GH_*" = "exclude"
"GITHUB_*" = "exclude"

[permissions.lp-build]
extends = ":workspace"
[permissions.lp-build.filesystem]
glob_scan_max_depth = 20
"~/.landing-pages-publishing" = "deny"
"~/.wrangler" = "deny"
"~/.config/.wrangler" = "deny"
"~/.config/wrangler" = "deny"
"~/Library/Preferences/.wrangler" = "deny"
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.config/gcloud" = "deny"
[permissions.lp-build.filesystem.":workspace_roots"]
".secrets" = "deny"
".dev.vars*" = "deny"
".env*" = "deny"
"**/.secrets" = "deny"
"**/.dev.vars*" = "deny"
"**/.env*" = "deny"

[permissions.lp-review]
extends = ":read-only"
[permissions.lp-review.filesystem]
glob_scan_max_depth = 20
"~/.landing-pages-publishing" = "deny"
"~/.wrangler" = "deny"
"~/.config/.wrangler" = "deny"
"~/.config/wrangler" = "deny"
"~/Library/Preferences/.wrangler" = "deny"
"~/.ssh" = "deny"
"~/.aws" = "deny"
"~/.config/gcloud" = "deny"
[permissions.lp-review.filesystem.":workspace_roots"]
".secrets" = "deny"
".dev.vars*" = "deny"
".env*" = "deny"
"**/.secrets" = "deny"
"**/.dev.vars*" = "deny"
"**/.env*" = "deny"
